name: Revisar y publicar Phishing Arena
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Comprobar JavaScript y la ronda
        run: |
          node --check app.js
          node --check emails.js
          node --check round.js
          node tests/round.test.cjs
      - name: Preparar únicamente los archivos del juego
        run: |
          mkdir -p _site
          cp index.html styles.css app.js emails.js round.js favicon.svg _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
